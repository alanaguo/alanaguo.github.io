<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.className+=' js'</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuxuan Guo</title>
<meta name="description" content="Homepage of Yuxuan Guo, PhD student at the University of Toronto working on P&amp;C insurance modelling and statistical learning.">
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --muted:#555c64; --rule:#e3e6ea; --accent:#1d4f91; --thumb:#eef1f5;
  --bar:68px;
  --serif:Charter,"Bitstream Charter","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171a;--ink:#e4e6e9;--muted:#aab2bb;--rule:#2b3036;--accent:#7fb0ee;--thumb:#1f252b}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--serif)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top navigation */
.topbar{position:sticky;top:0;z-index:10;min-height:var(--bar);background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:1800px;margin:0 auto;padding:0 4vw;min-height:var(--bar);display:flex;align-items:center}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 44px;list-style:none;margin:0;padding:0;font-family:"Times New Roman",Times,serif;font-size:1.2rem;font-weight:700}
.tabs a{display:block;padding:6px 0;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--accent);text-decoration:none}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

.layout{max-width:1800px;margin:0 auto;padding:0 4vw;display:grid;grid-template-columns:260px minmax(0,1fr);gap:5vw}

/* sidebar */
aside{position:sticky;top:var(--bar);align-self:start;height:calc(100vh - var(--bar));padding:40px 0 32px;display:flex;flex-direction:column;overflow-y:auto}
.photo{width:132px;height:132px;border-radius:14px;object-fit:cover;background:var(--thumb);display:block}
aside h1{font:600 1.6rem/1.2 var(--serif);margin:20px 0 6px}
.affil{margin:0 0 18px;color:var(--muted);font-size:.95rem;line-height:1.5}
.links{list-style:none;margin:0;padding:0;font-family:var(--sans);font-size:.9rem}
.links li{padding:2px 0}

/* content */
main{padding:40px 0 72px}
html:not(.js) section+section{margin-top:44px}
.js main section{display:none}
.js main section.active{display:block}
h2{font:600 1.3rem/1.3 var(--serif);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);position:relative}
h2::after{content:"";position:absolute;left:0;bottom:-1px;width:44px;height:2px;background:var(--accent)}
p{margin:0 0 12px}
